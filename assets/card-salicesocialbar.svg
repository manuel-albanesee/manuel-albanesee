  <text x="28" y="113" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#8b949e">A bar's digital menu, client-approved.</text>
  <rect x="28" y="140" width="73" height="26" rx="13" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-opacity=".45"/><text x="65" y="157.5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#fb7185">React 19</text><rect x="109.2" y="140" width="44" height="26" rx="13" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-opacity=".45"/><text x="131" y="157.5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#fb7185">Vite</text><rect x="160.8" y="140" width="66" height="26" rx="13" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-opacity=".45"/><text x="194" y="157.5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#fb7185">Zustand</text>
  <rect x="362" y="34" width="90" height="24" rx="12" fill="none" stroke="#f97316" stroke-opacity=".7"/>
